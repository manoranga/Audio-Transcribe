# Serves the Vite build output from ./dist (built index.html references /assets/*.js, NOT /src/main.tsx).
#
# In the repo: Settings → Pages → Build and deployment → Source MUST be "GitHub Actions".
# If Source is "Deploy from a branch" with folder "/" or "/docs", GitHub serves the raw
# repo index.html and the browser requests /src/main.tsx → 404.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Set Vite base path for GitHub Pages
        run: |
          NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            echo "User/org site at https://${OWNER}.github.io/ → base /"
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "Project site at https://${OWNER}.github.io/${NAME}/ → base /${NAME}/"
            echo "VITE_BASE_PATH=/${NAME}/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - name: Verify build (must not ship dev index.html)
        run: |
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html still references /src/main.tsx — the Vite build did not run correctly."
            exit 1
          fi
          echo "OK: dist/index.html uses hashed /assets bundle, not main.tsx"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
