# Builds Vite to ./dist (index references /assets/*.js, never /src/main.tsx) and pushes that folder
# to the gh-pages branch. GitHub Pages must serve THAT branch, not main.
#
# After the first successful run:
#   Settings → Pages → Build and deployment → Source: "Deploy from a branch"
#   Branch: gh-pages, Folder: / (root)
# Do NOT use main + / (root) — that serves the dev index.html and causes /src/main.tsx 404.
#
# If the workflow cannot push: Settings → Actions → General → Workflow permissions → Read and write.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Set Vite base path for GitHub Pages
        run: |
          NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            echo "User/org site → base /"
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "Project site → base /${NAME}/"
            echo "VITE_BASE_PATH=/${NAME}/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - name: Verify production bundle
        run: |
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html still references /src/main.tsx — the Vite build did not run correctly."
            exit 1
          fi
          echo "OK: dist/index.html uses hashed /assets bundle, not main.tsx"
      - name: Push dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
